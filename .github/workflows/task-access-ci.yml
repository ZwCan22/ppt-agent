name: Task access CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-access-tests:
    name: Task access integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ppt_test
          POSTGRES_PASSWORD: ppt_test_local_only
          POSTGRES_DB: ppt_agent_test
        ports:
          - "15433:5432"
        options: >-
          --health-cmd "pg_isready -U ppt_test -d ppt_agent_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.lock.txt
          python -m pip check

      - name: Run task access tests
        run: python -B -m unittest discover -s integration_tests -t . -v