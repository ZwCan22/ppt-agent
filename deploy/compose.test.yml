services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ppt_test
      POSTGRES_PASSWORD: ppt_test_local_only
      POSTGRES_DB: ppt_agent_test

    ports:
      - "127.0.0.1:15433:5432"

    tmpfs:
      - /var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ppt_test -d ppt_agent_test
      interval: 2s
      timeout: 3s
      retries: 30